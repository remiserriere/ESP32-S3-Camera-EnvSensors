name: Release – Build & Publish Firmware and Gauge Service

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & release firmware ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/cache
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run
        env:
          FIRMWARE_VERSION: ${{ github.ref_name }}

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          TAG="${{ github.ref_name }}"
          BIN=".pio/build/freenove_esp32s3/firmware.bin"
          ELF=".pio/build/freenove_esp32s3/firmware.elf"
          cp "$BIN" "release_assets/firmware-${TAG}.bin"
          cp "$ELF" "release_assets/firmware-${TAG}.elf"
          REPO="${{ github.repository }}"
          BINARY_URL="https://github.com/${REPO}/releases/download/${TAG}/firmware-${TAG}.bin"
          cat > release_assets/manifest.json <<EOF_ASSET
          {
            "version": "${TAG}",
            "url": "${BINARY_URL}",
            "notes": "See release notes on GitHub"
          }
          EOF_ASSET
          ls -lh release_assets/

      - name: Detect pre-release
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          if echo "$TAG" | grep -qE '-(alpha|beta|rc)'; then
            echo "flag=true" >> "$GITHUB_OUTPUT"
          else
            echo "flag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.prerelease.outputs.flag }}
          files: |
            release_assets/firmware-${{ github.ref_name }}.bin
            release_assets/firmware-${{ github.ref_name }}.elf
            release_assets/manifest.json

  publish-gauge-service-image:
    name: Publish gauge-service image ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/esp32-s3-camera-envsensors-gauge-service
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push gauge-service image
        uses: docker/build-push-action@v6
        with:
          context: ./gauge-service
          file: ./gauge-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

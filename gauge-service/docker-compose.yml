services:
  gauge-service:
    #image: ghcr.io/remiserriere/esp32-s3-camera-envsensors-gauge-service:latest
    build: .
    container_name: gauge-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8081
      DATA_DIR: /data
      # 0 = keep all snapshots (unlimited); positive = keep at most N
      MAX_SNAPSHOTS: 50
      SERVE_HISTORY_LIMIT: 100
      DEVICE_NAME: Gaz Tank Gauge
      MQTT_ENABLED: "true"
      MQTT_HOST: mqtt.local
      MQTT_PORT: 1883
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_USE_SSL: "false"
      MQTT_CLIENT_ID: gaz-tank-gauge-service
      MQTT_TOPIC_ROOT: gaz_tank_gauge
      HA_DISCOVERY_PREFIX: homeassistant
      # ── Calibration ─────────────────────────────────────────────────────────
      #
      # Option A: volume-mounted file (recommended for production)
      #   1. Save calibration via the /setup wizard (or run the service once and
      #      let the wizard write calibration.json into ./data/).
      #   2. Copy ./data/calibration.json to the same directory as this file.
      #   3. Uncomment the line below (and remove GAUGE_CONFIG from environment).
      #
      # volumes:
      #   - ./data:/data
      #   - ./calibration.json:/data/calibration.json:ro
      #
      # Option B: environment variable (handy for quick tests / CI)
      #   Paste the JSON string generated by the /setup wizard.
      #   Leave empty to show raw images without gauge reading.
      GAUGE_CONFIG: ""
      # Maximum allowed percentage change between two consecutive readings.
      # 0.0 = disabled (default). Example: 10.0 flags jumps larger than 10%.
      MAX_DELTA_PERCENT: "0.0"
      # false = immediate HTTP 200 + async background analysis (production)
      # true  = synchronous detailed analysis in the HTTP response (debugging)
      UPLOAD_DEBUG_MODE: "false"
    volumes:
      - ./data:/data
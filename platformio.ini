; PlatformIO Project Configuration File
; Freenove ESP32-S3 WROOM with Camera – Custom Firmware

[platformio]

[env:freenove_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Inject firmware version from git tag / FIRMWARE_VERSION env var
extra_scripts = pre:scripts/set_version.py

board_build.arduino.memory_type = qio_opi
; 8 MB flash layout: two OTA slots of 3.3 MB each + 1.5 MB SPIFFS + coredump.
; Use default.csv instead if your board has only 4 MB flash.
board_build.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Do NOT set ARDUINO_USB_CDC_ON_BOOT=1 – that routes Serial to the native
    ; USB-OTG port (GPIO 19/20) which disconnects during deep sleep.
    ; Without it, Serial maps to UART0 (GPIO 43/44 → CH340 → USB-SERIAL port)
    ; which stays enumerated with the host even when the ESP32 is sleeping.
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit INA219 @ ^1.2.3
    h2zero/NimBLE-Arduino @ ^2.5.0
    adafruit/Adafruit BusIO @ ^1.17.4
    knolleary/PubSubClient @ ^2.8.0
    ; ArduinoOTA is bundled with the ESP32 Arduino core – no extra entry needed

name: CI – Gauge service

# Triggered only when gauge-service code changes.
# On push to main a Docker image is also built and pushed to GHCR
# as the rolling `latest` image.

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
    paths:
      - 'gauge-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'gauge-service/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gauge-service

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r gauge-service/requirements.txt

      - name: Run tests
        run: PYTHONPATH=gauge-service pytest gauge-service/tests -q

  # ── Docker build (main branch only) ────────────────────────────────────────
  docker:
    name: Build & push Docker image (latest)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: gauge-service
          file: gauge-service/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

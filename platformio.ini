; PlatformIO Project Configuration File
; Freenove ESP32-S3 WROOM with Camera – Custom Firmware

[platformio]
; Inject firmware version from git tag / FIRMWARE_VERSION env var
extra_scripts = pre:scripts/set_version.py

[env:freenove_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi
; huge_app gives ~3 MB for the app; two OTA partitions require the default
; two-OTA layout instead – swap to default_8MB.csv if your board has 8 MB flash.
board_build.partitions = default.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit INA219 @ ^1.2.3
    h2zero/NimBLE-Arduino @ ^1.4.2
    adafruit/Adafruit BusIO @ ^1.16.1
    knolleary/PubSubClient @ ^2.8.0
    ; ArduinoOTA is bundled with the ESP32 Arduino core – no extra entry needed

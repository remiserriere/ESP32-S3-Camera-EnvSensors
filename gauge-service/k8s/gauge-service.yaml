apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gauge-service-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# ── Option A: calibration as a volume-mounted ConfigMap ─────────────────────
# Use this when you prefer to keep the calibration JSON outside the container
# and outside environment variables (easier to update without restarting).
#
# Steps:
#   1. Run the service once, calibrate via /setup, and click "Save".
#   2. Retrieve the file: kubectl cp <pod>:/data/calibration.json ./calibration.json
#      (or download it from the /api/calibration/file endpoint)
#   3. Create the ConfigMap:
#      kubectl create configmap gauge-calibration \
#        --from-file=calibration.json=./calibration.json
#   4. Uncomment the volumeMounts and volumes sections labelled "Option A" below,
#      and remove (or leave empty) the GAUGE_CONFIG env var.
#   5. To update calibration: kubectl create configmap gauge-calibration \
#        --from-file=calibration.json=./calibration.json --dry-run=client -o yaml \
#        | kubectl apply -f -
#      then rollout restart deployment/gauge-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gauge-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gauge-service
  template:
    metadata:
      labels:
        app: gauge-service
    spec:
      containers:
        - name: gauge-service
          image: ghcr.io/remiserriere/esp32-s3-camera-envsensors-gauge-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: APP_HOST
              value: 0.0.0.0
            - name: APP_PORT
              value: "8081"
            - name: DATA_DIR
              value: /data
            - name: MAX_SNAPSHOTS
              value: "50"
            - name: SERVE_HISTORY_LIMIT
              value: "100"
            - name: DEVICE_NAME
              value: Gaz Tank Gauge
            - name: MQTT_ENABLED
              value: "true"
            - name: MQTT_HOST
              value: mqtt.local
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_USERNAME
              value: homeassistant
            - name: MQTT_PASSWORD
              value: changeme
            - name: MQTT_USE_SSL
              value: "false"
            - name: MQTT_CLIENT_ID
              value: gaz-tank-gauge-service
            - name: MQTT_TOPIC_ROOT
              value: home/gaz_tank_gauge
            - name: HA_DISCOVERY_PREFIX
              value: homeassistant
            # ── Calibration ───────────────────────────────────────────────────────────
            # Option B: environment variable (leave empty when using Option A volume).
            # JSON calibration string generated by the /setup wizard.
            # Leave empty ("") to store images without gauge reading.
            - name: GAUGE_CONFIG
              value: ""
            # Max allowed % change between consecutive readings; 0 = disabled.
            - name: MAX_DELTA_PERCENT
              value: "0.0"
            - name: UPLOAD_DEBUG_MODE
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /data
            # Option A – uncomment to mount calibration.json from a ConfigMap:
            # - name: calibration
            #   mountPath: /data/calibration.json
            #   subPath: calibration.json
            #   readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gauge-service-data
        # Option A – uncomment when using a ConfigMap for calibration:
        # - name: calibration
        #   configMap:
        #     name: gauge-calibration
---
apiVersion: v1
kind: Service
metadata:
  name: gauge-service
spec:
  selector:
    app: gauge-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
